        /* ====== LOGIN SCREEN ====== */
        #login-screen {

            align-items: center;

            background: #0f0f0f;

            margin-bottom: 4px;
        }
        .login-subtitle {
            text-align: center;
            color: #808080;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 28px;
        }
        .auth-tabs {
            display: flex;
            border-bottom: 1px solid #2a2a2a;
            margin-bottom: 24px;
        }
        .auth-tab {
            flex: 1;
            background: transparent;
            border: none;
            color: #808080;
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 12px 8px;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.15s;
        }
        .auth-tab.active {
            color: #FF6B00;
            border-bottom-color: #FF6B00;
        }
        .auth-tab:hover:not(.active) {
            color: #b0b0b0;
        }
        .auth-input {
            width: 100%;
            background: #1c1c1c;
            border: 1px solid #2a2a2a;
            border-radius: 10px;
            padding: 14px 16px;
            color: #e0e0e0;
            font-size: 16px;
            font-family: 'Inter', sans-serif;
            margin-bottom: 14px;
            transition: border-color 0.15s;
        }
        .auth-input:focus {
            outline: none;
            border-color: #FF6B00;
        }
        .auth-input::placeholder {
            color: #606060;
        }
        .auth-btn {
            width: 100%;
            background: #FF6B00;
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 16px;
            font-family: 'Russo One', sans-serif;
            font-size: 15px;
            letter-spacing: 1.5px;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 52px;
            margin-top: 4px;
        }
        .auth-btn:hover:not(:disabled) {
            background: #e06000;
        }
        .auth-btn:active:not(:disabled) {
            transform: scale(0.98);
        }
        .auth-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .auth-error {
            color: #ef4444;
            font-size: 13px;
            margin-bottom: 12px;
            min-height: 20px;
            text-align: center;
        }
        .auth-success {
            color: #22c55e;
            font-size: 13px;
            margin-bottom: 12px;
            min-height: 20px;
            text-align: center;
        }
        .auth-spinner {
            width: 18px;
            height: 18px;
            border: 2.5px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: auth-spin 0.6s linear infinite;
            display: inline-block;
        }
        @keyframes auth-spin {
            to { transform: rotate(360deg); }
        }

        .signout-btn {
            background: transparent;
            border: 1px solid #333;
            color: #808080;
            font-size: 12px;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.15s;
            font-family: 'Inter', sans-serif;

        .signout-btn:hover {
            border-color: #555;
            color: #b0b0b0;
            background: rgba(255,255,255,0.03);
        }

        .song-row {

            cursor: pointer;
            min-height: 56px;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;

            width: 22px; height: 22px; border: 2px solid #555;
            border-radius: 4px; display: flex; align-items: center;
            justify-content: center; flex-shrink: 0; transition: all 0.15s ease;

            border-color: #FF6B00;

            width: 100%; font-family: 'Inter', sans-serif; transition: border-color 0.15s;

        .search-input:focus { outline: none; border-color: #FF6B00; }
        .search-input::placeholder { color: #606060; }

        .error-state {

            justify-content: center;

            text-align: center;

            font-size: 14px;
            font-weight: 500;
            margin-bottom: 4px;
        }
        .error-state .error-detail {
            color: #606060;
            font-size: 12px;
        }
        .retry-btn {
            margin-top: 16px;
            background: rgba(255,107,0,0.12);
            color: #ff8f33;
            border: 1px solid rgba(255,107,0,0.25);
            border-radius: 8px;
            padding: 10px 24px;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
            min-height: 44px;
        }
        .retry-btn:hover {
            background: rgba(255,107,0,0.2);
            border-color: rgba(255,107,0,0.4);
        }

        /* Mobile tabs */
        .mobile-tab-bar {
            display: none;
            border-bottom: 1px solid #232323;
            background: #0f0f0f;
            position: sticky;
            top: 0;
            z-index: 50;
        }
        .mobile-tab {
            flex: 1;
            padding: 14px 8px;
            font-size: 14px;
            font-weight: 700;
            text-align: center;
            cursor: pointer;
            border: none;
            background: transparent;
            color: #808080;
            border-bottom: 3px solid transparent;
            transition: all 0.15s;
            min-height: 48px;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.3px;
        }
        .mobile-tab.active {
            color: #FF6B00;
            border-bottom-color: #FF6B00;
        }
        .mobile-tab-badge {
            background: #FF6B00;
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            padding: 1px 7px;
            border-radius: 10px;
            margin-left: 4px;
            display: inline-block;
            min-width: 18px;
            text-align: center;
        }

        /* Scrollable panels on mobile */
        .scrollable-panel {
            -webkit-overflow-scrolling: touch;
            overflow-y: auto;
        }

        @media (max-width: 767px) {
            .mobile-tab-bar { display: flex; }
            .main-grid { flex-direction: column !important; }
            .col-left, .col-right { width: 100% !important; }
            .col-right { display: none; }
            .col-left { display: block; }
            .col-left.hidden-mobile { display: none !important; }
            .col-right.visible-mobile { display: block !important; }
            .desktop-only { display: none !important; }
            .login-card { padding: 32px 20px 28px; }
            .login-title { font-size: 22px; letter-spacing: 3px; }
        }

        @media (min-width: 768px) {
            .mobile-tab-bar { display: none !important; }
            .col-left, .col-right { display: block !important; }
        }
    </style>
</head>

        // ====== HELPERS ======
        function safeDuration(sec) {
            return (sec && sec > 0) ? sec : 0;
        }

        function formatDuration(sec) {
            if (!sec || sec <= 0) return "\u2014:\u2014\u2014";
            var m = Math.floor(sec / 60);
            var s = sec % 60;
            return m + ":" + (s < 10 ? "0" : "") + s;
        }

        function safeBpm(val) {
            return (val && val > 0) ? val : "\u2014";
        }

        function safeStr(val, fallback) {
            if (val === null || val === undefined) return (fallback !== undefined) ? fallback : "";
            return String(val);
        }

        function totalDuration(ids) {
            var sum = 0;
            for (var i = 0; i < ids.length; i++) {
                var song = getSongById(ids[i]);
                if (song) sum += safeDuration(song.duration_seconds);
            }
            return sum;
        }

        function getSongById(id) {

            return null;

        function escapeHtml(str) {
            if (!str) return "";
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

            var days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
            var months = ["January","February","March","April","May","June","July","August","September","October","November","December"];

            return days[d.getDay()] + ", " + months[d.getMonth()] + " " + d.getDate() + ", " + d.getFullYear();

        // ====== SUPABASE FETCH ======
        async function fetchSongsFromSupabase() {
            if (!supabaseClient) {
                showSongListError(
                    "Unable to connect to the database",
                    "Supabase client could not be initialized. Please refresh the page."
                );
                return;
            }

            try {
                var result = await supabaseClient
                    .from('songs')
                    .select('*')
                    .order('order_index', { ascending: true });

                var data = result.data;
                var error = result.error;

                if (error) {
                    showSongListError(
                        "Failed to load songs",
                        error.message || "A database error occurred. Please try again."
                    );
                    return;
                }

                if (!data || data.length === 0) {
                    showSongListError(
                        "No songs found",
                        "The song library is empty. Add songs to your Supabase database to get started."
                    );
                    return;
                }

                var mappedSongs = data.map(function(song) {
                    return {
                        id: song.id,
                        title: song.title || '',
                        artist: song.artist || '',
                        key_sig: song.key_sig || '',
                        time_sig: song.time_sig || '4/4',
                        duration_seconds: song.duration_seconds || 0,
                        bpm: song.bpm || null,
                        bpm_drums: song.bpm_drums || song.bpm || null,
                        notes: song.notes || song.cue_notes || '',
                        order_index: song.order_index
                    };
                });

                initializeSongs(mappedSongs);

            } catch (e) {
                showSongListError(
                    "Connection error",
                    "Could not reach the database. Check your internet connection and try again."
                );
            }
        }

        // ====== TOUCH DRAG AND DROP ======
        function addTouchDrag(card, cardId) {
            var startY = 0;
            var startIndex = 0;
            var isDragging = false;
            var cardHeight = 0;

            card.addEventListener('touchstart', function(e) {
                var target = e.target;
                if (target.tagName === 'TEXTAREA' || target.tagName === 'BUTTON' || target.tagName === 'INPUT') return;
                var parent = target.parentElement;
                if (parent && (parent.tagName === 'BUTTON' || parent.classList.contains('remove-btn'))) return;

                var container = document.getElementById("setlist-cards-container-e1f2");
                var cards = container.querySelectorAll(".setlist-card");
                startIndex = Array.from(cards).indexOf(card);
                startY = e.touches[0].clientY;
                cardHeight = card.offsetHeight + 12;
                isDragging = true;
                card.classList.add("touch-dragging");
            }, { passive: true });

            card.addEventListener('touchmove', function(e) {
                if (!isDragging) return;
                e.preventDefault();
                var currentY = e.touches[0].clientY;
                var diff = currentY - startY;
                card.style.transform = 'translateY(' + diff + 'px)';
                card.style.position = 'relative';
                card.style.zIndex = '100';
            }, { passive: false });

            card.addEventListener('touchend', function(e) {
                if (!isDragging) return;
                isDragging = false;
                var currentY = e.changedTouches[0].clientY;
                card.style.transform = '';
                card.style.position = '';
                card.style.zIndex = '';
                card.classList.remove("touch-dragging");

                var diff = currentY - startY;
                var indexDelta = Math.round(diff / cardHeight);
                var newIndex = Math.max(0, Math.min(setlistOrder.length - 1, startIndex + indexDelta));

                if (newIndex !== startIndex) {
                    var item = setlistOrder.splice(startIndex, 1)[0];
                    setlistOrder.splice(newIndex, 0, item);
                    renderSetlist();
                    updateSummary();
                }
            }, { passive: true });

            card.addEventListener('touchcancel', function() {
                isDragging = false;
                card.style.transform = '';
                card.style.position = '';
                card.style.zIndex = '';
                card.classList.remove("touch-dragging");
            }, { passive: true });
        }

                    cardEl.addEventListener("dragend", function() {
                        cardEl.classList.remove("dragging");
                        var allCards = container.querySelectorAll(".setlist-card");
                        for (var c = 0; c < allCards.length; c++) {
                            allCards[c].style.borderTop = "";
                            allCards[c].style.borderBottom = "";

                        draggedId = null;

                    cardEl.addEventListener("dragover", function(e) {
                        e.preventDefault();
                        e.dataTransfer.dropEffect = "move";
                        var allCards = container.querySelectorAll(".setlist-card");
                        for (var c = 0; c < allCards.length; c++) {
                            allCards[c].style.borderTop = "";
                            allCards[c].style.borderBottom = "";
                        }
                        var rect = cardEl.getBoundingClientRect();
                        var mid = rect.top + rect.height / 2;
                        if (e.clientY < mid) {
                            cardEl.style.borderTop = "2px solid #FF6B00";
                        } else {
                            cardEl.style.borderBottom = "2px solid #FF6B00";
                        }
                    });
                    cardEl.addEventListener("dragleave", function() {
                        cardEl.style.borderTop = "";
                        cardEl.style.borderBottom = "";
                    });
                    cardEl.addEventListener("drop", function(e) {
                        e.preventDefault();
                        cardEl.style.borderTop = "";
                        cardEl.style.borderBottom = "";
                        var targetId = cardIdLocal;
                        if (draggedId === null || draggedId === targetId) return;
                        var fromIdx = setlistOrder.indexOf(draggedId);
                        var toIdx = setlistOrder.indexOf(targetId);
                        if (fromIdx === -1 || toIdx === -1) return;
                        setlistOrder.splice(fromIdx, 1);
                        var rect2 = cardEl.getBoundingClientRect();
                        var mid2 = rect2.top + rect2.height / 2;
                        var insertIdx = e.clientY < mid2 ? setlistOrder.indexOf(targetId) : setlistOrder.indexOf(targetId) + 1;
                        if (insertIdx === -1) insertIdx = setlistOrder.length;
                        setlistOrder.splice(insertIdx, 0, draggedId);
                        renderSetlist();
                        updateSummary();
                    });
                })(card, id);

                addTouchDrag(card, id);

                container.appendChild(card);
            }
        }

dy tr{border-bottom:1px solid #2a2a2a}.footer-print{text-align:center;margin-top:24px;color:#555;font-size:12px}@media print{body{background:#fff!important;color:#000!important;padding:0}.screen-buttons{display:none!important}.page-wrap{padding:20px;max-width:100%}.header-section h1{color:#FF6B00!important}.header-section p{color:#333!important}.header-section hr{border-top-color:#ccc!important}.table-wrap{overflow:visible}table{background:#fff!important;min-width:0}thead th{background:#FF6B00!important;color:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}tbody td{color:#333!important}tbody td:first-child{color:#FF6B00!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}tbody td:nth-child(2){color:#111!important}tbody tr:nth-child(even){background:#f5f5f5!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}tbody tr:nth-child(odd){background:#fff!important}tbody tr{page-break-inside:avoid}.footer-print{color:#999!important}}</style></head><body><div class="page-wrap"><div class="screen-buttons"><button id="printBtn">&#128424; Print / Save as PDF</button><button id="closeBtn" class="btn-close">&#10005; Close</button></div><div class="header-section"><h1>DIRTY DIAPERZ</h1><p style="font-size:16px;color:#ccc;font-weight:600;">Show Setlist</p><p>Date: ' + dateStr + '</p><p>Total Runtime: ' + totalStr + ' &bull; ' + setlistOrder.length + ' songs</p><hr></div><div class="table-wrap"><table><thead><tr><th style="width:40px">#</th><th>Song Title</th><th>Artist</th><th style="width:80px">Key</th><th style="width:60px">Length</th><th style="width:110px">BPM Studio/Drums</th><th style="width:200px">Notes</th></tr></thead><tbody>' + rows + '</tbody></table></div><p class="footer-print">Generated by Dirty Diaperz Setlist Builder &bull; ' + dateStr + '</p></div>';

        // ====== MOBILE TABS SETUP ======
        function setupMobileTabs() {
            var tabSongsBtn = document.getElementById("tab-songs-btn");
            var tabSetlistBtn = document.getElementById("tab-setlist-btn");

            if (!tabSongsBtn || !tabSetlistBtn) return;

            tabSongsBtn.addEventListener("click", function() { switchMobileTab("songs"); });
            tabSetlistBtn.addEventListener("click", function() { switchMobileTab("setlist"); });

            function onResize() {
                if (window.innerWidth >= 768) {
                    var colLeft = document.getElementById("col-left-i9j0");
                    var colRight = document.getElementById("col-right-w3x4");
                    colLeft.classList.remove("hidden-mobile");
                    colRight.classList.remove("visible-mobile");
                } else {
                    switchMobileTab(currentMobileTab);
                }
            }
            window.addEventListener("resize", onResize);
            if (window.innerWidth < 768) switchMobileTab("songs");
        }

        // ====== SEARCH ======
        document.getElementById("search-input-m3n4").addEventListener("input", function(e) {
            renderSongList(e.target.value);

        // ====== GENERATE BUTTON ======
        document.getElementById("generate-btn-k7l8").addEventListener("click", function() {

        // ====== INIT APP (called after auth) ======
        function initApp() {

            var songListContainer = document.getElementById("song-list-container-o5p6");
