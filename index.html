        async function fetchSongsFromSupabase() {
            if (!supabaseClient) {
                useDemoFallback();
                return;

                var result = await supabaseClient
                    .from('songs')
                    .select('*')
                    .order('order_index', { ascending: true });

                var data = result.data;

                if (error || !data || data.length === 0) {

                    return {

                var noMatch = document.createElement("div");

                noMatch.textContent = "No songs match your search";
                container.appendChild(noMatch);
                return;
            }

            for (var j = 0; j < filtered.length; j++) {
                var song = filtered[j];
                var isSelected = !!selectedIds[song.id];

                var row = document.createElement("div");
                row.className = "song-row border-b border-bg-700" + (isSelected ? " selected" : "");
                row.setAttribute("data-song-id", song.id);

                var checkBox = document.createElement("div");
                checkBox.className = "check-box";
                if (isSelected) {
                    checkBox.innerHTML = '<svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 6.5L4.5 9L10 3" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
                }

                var infoDiv = document.createElement("div");
                infoDiv.className = "flex-1 min-w-0";

                var titleP = document.createElement("p");
                titleP.className = "text-sm font-semibold text-txt-100 truncate";
                titleP.textContent = song.title || "\u2014";

                var artistP = document.createElement("p");
                artistP.className = "text-xs text-txt-400 truncate";
                artistP.textContent = song.artist || "";

                infoDiv.appendChild(titleP);
                infoDiv.appendChild(artistP);

                var bpmBadge = document.createElement("span");
                bpmBadge.className = "badge-bpm hidden md:inline-block";
                bpmBadge.textContent = safeBpm(song.bpm) + " BPM";

                var durSpan = document.createElement("span");
                durSpan.className = "text-xs text-txt-500 tabular-nums whitespace-nowrap";
                durSpan.style.minWidth = "36px";
                durSpan.style.textAlign = "right";
                durSpan.textContent = formatDuration(song.duration_seconds);

                row.appendChild(checkBox);
                row.appendChild(infoDiv);
                row.appendChild(bpmBadge);
                row.appendChild(durSpan);

                (function(songId) {
                    row.addEventListener("click", function() {
                        toggleSong(songId);
                    });
                })(song.id);

                container.appendChild(row);
            }
        }

        // ====== TOGGLE SONG ======
        function toggleSong(id) {
            var wasAdding = !selectedIds[id];
            if (selectedIds[id]) {
                delete selectedIds[id];
                var newOrder = [];
                for (var i = 0; i < setlistOrder.length; i++) {
                    if (setlistOrder[i] !== id) newOrder.push(setlistOrder[i]);
                }
                setlistOrder = newOrder;
            } else {
                selectedIds[id] = true;
                setlistOrder.push(id);
            }
            var searchVal = document.getElementById("search-input-m3n4").value;
            renderSongList(searchVal);
            renderSetlist();
            updateSummary();
            updateMobileSetlistBadge();

            // On mobile, switch to setlist tab after adding a song
            if (wasAdding && isMobile()) {
                setTimeout(function() {
                    switchMobileTab("setlist");
                }, 300);
            }
        }

        // ====== TOUCH DRAG AND DROP ======
        function addTouchDrag(card, cardId) {
            var startY = 0;
            var startIndex = 0;
            var isDragging = false;
            var cardHeight = 0;

            card.addEventListener('touchstart', function(e) {
                // Don't drag if touching textarea or buttons
                var target = e.target;
                if (target.tagName === 'TEXTAREA' || target.tagName === 'BUTTON' || target.tagName === 'INPUT') return;
                // Check parent too
                var parent = target.parentElement;
                if (parent && (parent.tagName === 'BUTTON' || parent.classList.contains('remove-btn'))) return;

                var container = document.getElementById("setlist-cards-container-e1f2");
                var cards = container.querySelectorAll(".setlist-card");
                startIndex = Array.from(cards).indexOf(card);
                startY = e.touches[0].clientY;
                cardHeight = card.offsetHeight + 12; // include margin
                isDragging = true;
                card.classList.add("touch-dragging");
            }, { passive: true });

            card.addEventListener('touchmove', function(e) {
                if (!isDragging) return;
                e.preventDefault();
                var currentY = e.touches[0].clientY;
                var diff = currentY - startY;
                card.style.transform = 'translateY(' + diff + 'px)';
                card.style.position = 'relative';
                card.style.zIndex = '100';
            }, { passive: false });

            card.addEventListener('touchend', function(e) {
                if (!isDragging) return;
                isDragging = false;
                var currentY = e.changedTouches[0].clientY;
                card.style.transform = '';
                card.style.position = '';
                card.style.zIndex = '';
                card.classList.remove("touch-dragging");

                var diff = currentY - startY;
                var indexDelta = Math.round(diff / cardHeight);
                var newIndex = Math.max(0, Math.min(setlistOrder.length - 1, startIndex + indexDelta));

                if (newIndex !== startIndex) {
                    var item = setlistOrder.splice(startIndex, 1)[0];
                    setlistOrder.splice(newIndex, 0, item);
                    renderSetlist();
                    updateSummary();
                }
            }, { passive: true });

            card.addEventListener('touchcancel', function() {
                isDragging = false;
                card.style.transform = '';
                card.style.position = '';
                card.style.zIndex = '';
                card.classList.remove("touch-dragging");
            }, { passive: true });
        }

        // ====== RENDER SETLIST ======
        function renderSetlist() {
            var container = document.getElementById("setlist-cards-container-e1f2");
            var genBtn = document.getElementById("generate-btn-k7l8");
            container.innerHTML = "";

            updateMobileSetlistBadge();

            if (setlistOrder.length === 0) {
                genBtn.disabled = true;
                var emptyDiv = document.createElement("div");
                emptyDiv.className = "text-center py-16 px-5";
                emptyDiv.innerHTML = '<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#606060" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin:0 auto 16px;"><path d="M12 19l-7-7 7-7"/><path d="M19 12H5"/></svg><p class="text-txt-400 text-sm font-medium">Pick songs from the list to build your setlist</p>';
                container.appendChild(emptyDiv);
                return;
            }

            genBtn.disabled = false;

            for (var i = 0; i < setlistOrder.length; i++) {
                var id = setlistOrder[i];
                var song = getSongById(id);
                if (!song) continue;

                var card = document.createElement("div");
                card.className = "setlist-card";
                card.setAttribute("draggable", "true");
                card.setAttribute("data-setlist-id", id);

                // Remove button
                var removeBtn = document.createElement("button");
                removeBtn.className = "remove-btn";
                removeBtn.setAttribute("aria-label", "Remove song");
                removeBtn.setAttribute("data-remove-id", id);
                removeBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3 3L11 11M3 11L11 3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';

                (function(sid) {
                    removeBtn.addEventListener("click", function(e) {
                        e.stopPropagation();
                        toggleSong(sid);
                    });
                })(id);

                // Content wrapper
                var flexWrap = document.createElement("div");
                flexWrap.className = "flex items-start gap-3";

                // Left: drag handle + number
                var leftCol = document.createElement("div");
                leftCol.className = "flex flex-col items-center gap-1 pt-1";
                leftCol.style.cursor = "grab";

                var dragHandle = document.createElement("span");
                dragHandle.className = "text-txt-500 text-xs select-none";
                dragHandle.textContent = "\u2807";

                var numBadge = document.createElement("span");
                numBadge.className = "number-badge";
                numBadge.textContent = (i + 1);

                leftCol.appendChild(dragHandle);
                leftCol.appendChild(numBadge);

                // Right: song info
                var rightCol = document.createElement("div");
                rightCol.className = "flex-1 min-w-0 pr-8";

                var cardTitle = document.createElement("p");
                cardTitle.className = "font-semibold text-sm text-txt-100 truncate";
                cardTitle.textContent = song.title || "\u2014";

                var cardArtist = document.createElement("p");
                cardArtist.className = "text-xs text-txt-400 mb-2";
                cardArtist.textContent = song.artist || "";

                var displayKey = safeStr(song.key_sig, "\u2014") || "\u2014";
                var displayTime = safeStr(song.time_sig, "4/4") || "4/4";

                var infoRow1 = document.createElement("div");
                infoRow1.className = "flex flex-wrap items-center gap-x-3 gap-y-1 text-xs text-txt-300 mb-1";
                infoRow1.innerHTML = "Key: <strong class='text-txt-200'>" + escapeHtml(displayKey) + "</strong> <span class='text-txt-500'>|</span> Time: <strong class='text-txt-200'>" + escapeHtml(displayTime) + "</strong> <span class='text-txt-500'>|</span> <span class='tabular-nums'>" + formatDuration(song.duration_seconds) + "</span>";

                var infoRow2 = document.createElement("div");
                infoRow2.className = "flex flex-wrap items-center gap-x-3 gap-y-1 text-xs text-txt-400 mb-2";
                infoRow2.innerHTML = "BPM: <strong class='text-accent-400'>" + safeBpm(song.bpm) + "</strong> <span class='text-txt-500'>|</span> Drums: <strong class='text-accent-400'>" + safeBpm(song.bpm_drums) + "</strong>";

                var textarea = document.createElement("textarea");
                textarea.className = "notes-textarea";
                textarea.rows = 2;
                textarea.placeholder = "Notes\u2026";
                textarea.setAttribute("data-notes-id", id);
                textarea.value = songNotes[id] || "";

                (function(sid) {
                    textarea.addEventListener("input", function() {
                        songNotes[sid] = this.value;
                    });
                })(id);

                rightCol.appendChild(cardTitle);
                rightCol.appendChild(cardArtist);
                rightCol.appendChild(infoRow1);
                rightCol.appendChild(infoRow2);
                rightCol.appendChild(textarea);

                flexWrap.appendChild(leftCol);
                flexWrap.appendChild(rightCol);

                card.appendChild(removeBtn);
                card.appendChild(flexWrap);

                // Desktop drag events
                (function(cardEl, cardIdLocal) {
                    cardEl.addEventListener("dragstart", function(e) {
                        draggedId = cardIdLocal;
                        cardEl.classList.add("dragging");
                        e.dataTransfer.effectAllowed = "move";
                        e.dataTransfer.setData("text/plain", String(cardIdLocal));
                    });
                    cardEl.addEventListener("dragend", function() {
                        cardEl.classList.remove("dragging");
                        var allCards = container.querySelectorAll(".setlist-card");
                        for (var c = 0; c < allCards.length; c++) {
                            allCards[c].style.borderTop = "";
                            allCards[c].style.borderBottom = "";
                        }
                        draggedId = null;
                    });
                    cardEl.addEventListener("dragover", function(e) {
                        e.preventDefault();
                        e.dataTransfer.dropEffect = "move";
                        var allCards = container.querySelectorAll(".setlist-card");
                        for (var c = 0; c < allCards.length; c++) {
                            allCards[c].style.borderTop = "";
                            allCards[c].style.borderBottom = "";
                        }
                        var rect = cardEl.getBoundingClientRect();
                        var mid = rect.top + rect.height / 2;
                        if (e.clientY < mid) {
                            cardEl.style.borderTop = "2px solid #FF6B00";
                        } else {
                            cardEl.style.borderBottom = "2px solid #FF6B00";
                        }
                    });
                    cardEl.addEventListener("dragleave", function() {
                        cardEl.style.borderTop = "";
                        cardEl.style.borderBottom = "";
                    });
                    cardEl.addEventListener("drop", function(e) {
                        e.preventDefault();
                        cardEl.style.borderTop = "";
                        cardEl.style.borderBottom = "";
                        var targetId = cardIdLocal;
                        if (draggedId === null || draggedId === targetId) return;
                        var fromIdx = setlistOrder.indexOf(draggedId);
                        var toIdx = setlistOrder.indexOf(targetId);
                        if (fromIdx === -1 || toIdx === -1) return;
                        setlistOrder.splice(fromIdx, 1);
                        var rect2 = cardEl.getBoundingClientRect();
                        var mid2 = rect2.top + rect2.height / 2;
                        var insertIdx = e.clientY < mid2 ? setlistOrder.indexOf(targetId) : setlistOrder.indexOf(targetId) + 1;
                        if (insertIdx === -1) insertIdx = setlistOrder.length;
                        setlistOrder.splice(insertIdx, 0, draggedId);
                        renderSetlist();
                        updateSummary();
                    });
                })(card, id);

                // Touch drag events for mobile
                addTouchDrag(card, id);

                container.appendChild(card);
            }
        }

        // ====== UPDATE SUMMARY ======
        function updateSummary() {
            var ids = Object.keys(selectedIds);
            document.getElementById("selected-count-s9t0").textContent = ids.length;
            var totalSec = totalDuration(setlistOrder);
            document.getElementById("selected-total-time-u1v2").textContent = formatDuration(totalSec);
            document.getElementById("total-runtime-c9d0").textContent = formatDuration(totalSec);
        }

        // ====== GENERATE PRINT VIEW ======
        function generatePrintView() {
            if (setlistOrder.length === 0) return;
            var dateStr = formatShowDate();
            var totalSec = totalDuration(setlistOrder);
            var totalStr = formatDuration(totalSec);

            var rows = "";
            for (var i = 0; i < setlistOrder.length; i++) {
                var s = getSongById(setlistOrder[i]);
                if (!s) continue;
                var notes = escapeHtml(songNotes[s.id] || "").replace(/\n/g, "<br>");
                var bgColor = i % 2 === 0 ? "#222" : "#1a1a1a";
                var printKey = safeStr(s.key_sig, "\u2014") || "\u2014";
                var printTime = safeStr(s.time_sig, "4/4") || "4/4";
                var printBpm = safeBpm(s.bpm);
                var printBpmDrums = safeBpm(s.bpm_drums);
                rows += '<tr style="background:' + bgColor + ';"><td style="padding:10px 12px;text-align:center;font-weight:700;color:#FF6B00;border-bottom:1px solid #2a2a2a;">' + (i + 1) + '</td><td style="padding:10px 12px;font-weight:600;color:#eee;border-bottom:1px solid #2a2a2a;">' + escapeHtml(s.title || "\u2014") + '</td><td style="padding:10px 12px;color:#ccc;border-bottom:1px solid #2a2a2a;">' + escapeHtml(s.artist || "") + '</td><td style="padding:10px 12px;text-align:center;color:#ccc;border-bottom:1px solid #2a2a2a;">' + escapeHtml(printKey) + '</td><td style="padding:10px 12px;text-align:center;color:#ccc;font-variant-numeric:tabular-nums;border-bottom:1px solid #2a2a2a;">' + formatDuration(s.duration_seconds) + '</td><td style="padding:10px 12px;text-align:center;color:#ccc;font-variant-numeric:tabular-nums;border-bottom:1px solid #2a2a2a;">' + printBpm + ' / ' + printBpmDrums + '</td><td style="padding:10px 12px;color:#999;font-size:12px;line-height:1.4;max-width:200px;border-bottom:1px solid #2a2a2a;">' + (notes || "\u2014") + "</td></tr>";
            }

            var printHtml = '<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><title>Dirty Diaperz Setlist</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Russo+One&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:"Inter",sans-serif;background:#0f0f0f;color:#e0e0e0;padding:0;padding-bottom:env(safe-area-inset-bottom,0)}.page-wrap{max-width:900px;margin:0 auto;padding:24px 16px}@media(min-width:768px){.page-wrap{padding:40px 32px}}.screen-buttons{display:flex;gap:12px;margin-bottom:30px;flex-wrap:wrap}.screen-buttons button{padding:10px 24px;border-radius:8px;border:none;font-family:"Inter",sans-serif;font-weight:600;font-size:14px;cursor:pointer;min-height:44px}.btn-print{background:#FF6B00;color:#fff}.btn-print:hover{background:#e06000}.btn-close{background:#333;color:#ccc}.btn-close:hover{background:#444}.header-section{text-align:center;margin-bottom:24px}.header-section h1{font-family:"Russo One",sans-serif;font-size:24px;color:#FF6B00;letter-spacing:3px;margin-bottom:8px}@media(min-width:768px){.header-section h1{font-size:32px}}.header-section p{color:#aaa;font-size:14px;margin:2px 0}.header-section hr{border:none;border-top:2px solid #333;margin-top:16px}.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}table{width:100%;border-collapse:collapse;background:#1c1c1c;border-radius:8px;overflow:hidden;min-width:600px}thead th{background:#FF6B00;color:#fff;text-align:left;padding:12px;font-size:12px;text-transform:uppercase;letter-spacing:.5px;font-weight:700}thead th:nth-child(1),thead th:nth-child(4),thead th:nth-child(5),thead th:nth-child(6){text-align:center}tbody tr{border-bottom:1px solid #2a2a2a}.footer-print{text-align:center;margin-top:24px;color:#555;font-size:12px}@media print{body{background:#fff!important;color:#000!important;padding:0}.screen-buttons{display:none!important}.page-wrap{padding:20px;max-width:100%}.header-section h1{color:#FF6B00!important}.header-section p{color:#333!important}.header-section hr{border-top-color:#ccc!important}.table-wrap{overflow:visible}table{background:#fff!important;min-width:0}thead th{background:#FF6B00!important;color:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}tbody td{color:#333!important}tbody td:first-child{color:#FF6B00!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}tbody td:nth-child(2){color:#111!important}tbody tr:nth-child(even){background:#f5f5f5!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}tbody tr:nth-child(odd){background:#fff!important}tbody tr{page-break-inside:avoid}.footer-print{color:#999!important}}</style></head><body><div class="page-wrap"><div class="screen-buttons"><button id="printBtn">&#128424; Print / Save as PDF</button><button id="closeBtn" class="btn-close">&#10005; Close</button></div><div class="header-section"><h1>DIRTY DIAPERZ</h1><p style="font-size:16px;color:#ccc;font-weight:600;">Show Setlist</p><p>Date: ' + dateStr + '</p><p>Total Runtime: ' + totalStr + ' &bull; ' + setlistOrder.length + ' songs</p><hr></div><div class="table-wrap"><table><thead><tr><th style="width:40px">#</th><th>Song Title</th><th>Artist</th><th style="width:80px">Key</th><th style="width:60px">Length</th><th style="width:110px">BPM Studio/Drums</th><th style="width:200px">Notes</th></tr></thead><tbody>' + rows + '</tbody></table></div><p class="footer-print">Generated by Dirty Diaperz Setlist Builder &bull; ' + dateStr + '</p></div>';

            printHtml += '<scr' + 'ipt>document.getElementById("printBtn").addEventListener("click",function(){window.print()});document.getElementById("closeBtn").addEventListener("click",function(){window.close()});</scr' + 'ipt></body></html>';

        // ====== MOBILE TABS SETUP ======
        function setupMobileTabs() {
            var tabSongsBtn = document.getElementById("tab-songs-btn");
            var tabSetlistBtn = document.getElementById("tab-setlist-btn");

            if (!tabSongsBtn || !tabSetlistBtn) return;

            tabSongsBtn.addEventListener("click", function() { switchMobileTab("songs"); });
            tabSetlistBtn.addEventListener("click", function() { switchMobileTab("setlist"); });

            function onResize() {
                if (window.innerWidth >= 768) {
                    var colLeft = document.getElementById("col-left-i9j0");
                    var colRight = document.getElementById("col-right-w3x4");
                    colLeft.classList.remove("hidden-mobile");
                    colRight.classList.remove("visible-mobile");
                } else {
                    switchMobileTab(currentMobileTab);
                }
            }
            window.addEventListener("resize", onResize);
            if (window.innerWidth < 768) switchMobileTab("songs");
        }

        // ====== SEARCH ======
        document.getElementById("search-input-m3n4").addEventListener("input", function(e) {
            renderSongList(e.target.value);
        });

        // ====== GENERATE BUTTON ======
        document.getElementById("generate-btn-k7l8").addEventListener("click", function() {
            generatePrintView();
        });

        // ====== INIT ======
        setupMobileTabs();

        // Show loading state then fetch from Supabase
        var songListContainer = document.getElementById("song-list-container-o5p6");
        songListContainer.innerHTML = '<div class="p-8 text-center text-txt-500 text-sm">Loading songs\u2026</div>';

        // Fetch songs on DOMContentLoaded (or immediately if already loaded)
        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", function() {
                fetchSongsFromSupabase();
            });
        } else {
            fetchSongsFromSupabase();
        }
    })();
    </script>
